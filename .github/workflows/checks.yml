name: Tests and dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies and audit tool
        run: |
          python -m pip install --upgrade "pip>=26.2.2"
          python -m pip install --upgrade -r requirements.txt -r requirements-dev.txt
      - name: Test payload logic and certificate trust
        run: python -m unittest discover -s tests -v
      - name: Audit resolved runtime dependencies
        run: python -m pip_audit --progress-spinner off -r requirements.txt
